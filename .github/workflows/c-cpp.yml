name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: install git
    - run: winget install --id Git.Git -e --source winget

    - name: make build directory 
      run: mkdir build
      
    - name: cmake build
      run: cd build && cmake CMakeLists.txt .. 
    
    - name: make build
      run: cd build && make ./build

    - name: make check
      run: cd build && make check ./build
    
    - name: make distcheck
      run: cd build && make distcheck ./build
