name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: goto-directory
      run: cd build
    
    - name: view-dir
      run: dir
      
    - name: make
      run: make ./build
    
    - name: make check
      run: make check ./build
    
    - name: make distcheck
      run: make distcheck ./build
